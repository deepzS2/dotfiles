source=./colors.conf
source=./monitors.conf

# Environment variables
env=GTK_IM_MODULE,ibus
env=QT_IM_MODULE,ibus
env=XMODIFIERS,@im=ibus
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_QPA_PLATFORM,Wayland;xcb
env=NIXOS_OZONE_WL,1
env=WLR_DRM_NO_ATOMIC,1

# Config variables (reuse with $name)
var=term,foot

# Exec
exec_once=initialize_setup
exec_once=systemctl --user start mango-session.target

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.85

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
auto_reload_config=1
float_full_to_top=1
disable_middle_paste=1
monocle_tab_mode=1
deck_tab_mode=1
gesture_live=1
xwayland_persistence=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=Bibata-Modern-Classic
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=br

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
# tag_rule=id:4,layout_name:tile
# tag_rule=id:5,layout_name:tile
# tag_rule=id:6,layout_name:tile
# tag_rule=id:7,layout_name:tile
# tag_rule=id:8,layout_name:tile
# tag_rule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# personal binds
bind=ALT,space,spawn,rofi -show drun -theme ~/.config/rofi/launcher.rasi
bind=ALT,Return,spawn,$term
bind=SUPER,c,spawn,discord
bind=SUPER,b,spawn,zen
bindl=SUPER+ALT,l,spawn,sheez ipc call lockScreen toggle
bind=SUPER,escape,spawn,sheez ipc call logout toggle
bind=Alt,v,spawn_shell,cliphistory c
bind=Alt,t,spawn_shell,theme-switcher
bind=Alt,p,spawn_shell,passmenu
bind=Alt,n,spawn_shell,sheez ipc call notifications toggle

# Screenshots
bind=NONE,Print,spawn,screenshot fullscreen
bind=SHIFT,Print,spawn,screenshot region
bind=CTRL+SHIFT,Print,spawn,screenshot window
bind=CTRL+SUPER,Print,spawn,screenshot freeze
bind=SHIFT+SUPER,Print,spawn,screenshot freeze-region
bind=SUPER,Print,spawn,screenshot annotate

# exit
bind=SUPER,m,quit
bind=SUPER,w,smartkillclient,

# switch window focus
# bind=SUPER,Tab,focusstack,next
bind=SUPER,Tab,overcircle,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverview,
bind=SUPER,backslash,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
# bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,q,toggle_scratchpad
bind=ALT,e,toggle_named_scratchpad,Emacs,none,sh -c "emacs & sleep 2 && mmsg dispatch centerwin"
bind=ALT+SHIFT,f,toggle_named_scratchpad,none,yazi-files,$term -T yazi-files -o locked-title=yes yazi

# scroller layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,
bind=ALT+SUPER+CTRL,h,scroller_stack,left
bind=ALT+SUPER+CTRL,l,scroller_stack,right
bind=ALT+SUPER+CTRL,k,scroller_stack,up
bind=ALT+SUPER+CTRL,j,scroller_stack,down

#dwindle layout(manual split mode)
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
# bind=SUPER+SHIFT,h,viewtoleft,0
bind=ALT,h,viewtoleft_have_client,0
# bind=SUPER+SHIFT,l,viewtoright,0
bind=ALT,l,viewtoright_have_client,0
bind=CTRL+SUPER,h,tagtoleft,0
bind=CTRL+SUPER,l,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+ALT,1,tag,1,0
bind=SUPER+ALT,2,tag,2,0
bind=SUPER+ALT,3,tag,3,0
bind=SUPER+ALT,4,tag,4,0
bind=SUPER+ALT,5,tag,5,0
bind=SUPER+ALT,6,tag,6,0
bind=SUPER+ALT,7,tag,7,0
bind=SUPER+ALT,8,tag,8,0
bind=SUPER+ALT,9,tag,9,0

# monitor switch
bind=ALT+SHIFT,h,focusmon,left
bind=ALT+SHIFT,l,focusmon,right
bind=SUPER+ALT,h,tagmon,left
# bind=SUPER+ALT,l,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,j,resizewin,+0,+50
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gestures (trackpad, smooth follow preview via gesture_live)
gesturebind=none,left,4,viewprev_have_client
gesturebind=none,right,4,viewnext_have_client

# layer rule
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
layer_rule=no_animation:1,no_blur:1,layer_name:quickshell

# window rules
window_rule=is_floating:1,app_id:steam
window_rule=is_floating:1,width:350,height:700,title:Friends List,app_id:steam
window_rule=is_floating:0,scroller_proportion:1.0,title:Steam,app_id:steam
window_rule=is_floating:1,title:Picture-in-Picture,app_id:zen
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,title:Confirm to replace files,app_id:org.gnome.Nautilus
window_rule=is_floating:1,title:File Operation Progress,app_id:org.gnome.Nautilus
window_rule=is_floating:1,app_id:blueman
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,tags:3,app_id:obsproject
window_rule=is_named_scratchpad:1,width:1280,height:800,title:yazi-files
window_rule=is_named_scratchpad:1,width:1280,height:800,app_id:Emacs
window_rule=tags:1,scroller_proportion_single:1.0,app_id:foot
window_rule=tags:2,scroller_proportion:1.0,app_id:zen-beta
window_rule=tags:3,scroller_proportion:1.0,app_id:discord
