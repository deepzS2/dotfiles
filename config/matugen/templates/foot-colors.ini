[colors-dark]
alpha=0.8

# Cursor Colors (Format: <text-color> <cursor-color>)
cursor={{colors.on_surface_variant.default.hex_stripped}} {{colors.on_surface.default.hex_stripped}}

# Base UI Colors
foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
selection-foreground={{colors.on_secondary.default.hex_stripped}}
selection-background={{colors.secondary_fixed_dim.default.hex_stripped}}
urls={{colors.primary.default.hex_stripped}}

# ===================================================================
# 16-COLOR TERMINAL PALETTE
# ===================================================================
# Normal colors
regular0=4c4c4c                                                                                            # black
regular1={{ "#ac8a8c" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # red
regular2={{ "#8aac8b" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # green
regular3={{ "#aca98a" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # yellow
regular4={{colors.primary.default.hex_stripped}}                                                           # blue
regular5={{ "#ac8aac" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # magenta
regular6={{ "#8aacab" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # cyan
regular7=f0f0f0                                                                                            # white

# Bright colors
bright0=262626                                                                                            # bright black
bright1={{ "#c49ea0" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # bright red
bright2={{ "#9ec49f" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # bright green
bright3={{ "#c4c19e" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # bright yellow
bright4={{ "#a39ec4" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # bright blue
bright5={{ "#c49ec4" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # bright magenta
bright6={{ "#9ec3c4" | to_color | harmonize: {{ colors.primary.default.rgb }} | format: "hex_stripped" }} # bright cyan
bright7=e7e7e7                                                                                            # bright white
