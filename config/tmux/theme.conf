# Status
set -g status-style 'bg=#{@thm_surface_low},fg=#{@thm_fg}'
set -g status-position top
set -g status-justify centre

# Status left
set -g status-left-style '#{?client_prefix,bg=#{@thm_primary}#,fg=#{@thm_surface_low}#,bold,default}'
set -g status-left ' tmux '

# Status right
set -g status-right ' session #S '

# Windows
set -g window-status-format ' #I: #W '
set -g window-status-current-format ' #I: #W #{?window_zoomed_flag,󰊓 ,}'

set -g window-status-style default
set -g window-status-current-style 'bg=#{@thm_primary},fg=#{@thm_surface_low}'

# Panes
set -g pane-border-style 'fg=#{@thm_outline}'
set -g pane-active-border-style 'fg=#{@thm_fg}'

# Popups
set -g popup-style 'bg=default,fg=#{@thm_fg}'
set -g popup-border-style 'bg=default,fg=#{@thm_outline}'
set -g popup-border-lines single
