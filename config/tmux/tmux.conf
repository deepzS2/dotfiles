# Terminal and session behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features sixel
set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# Prefix key
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Custom key rebinding
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf
unbind c
bind c new-window -c "#{pane_current_path}"
bind g popup -d "#{pane_current_path}" -w 92% -h 90% -E "lazygit"
bind w popup -d "#{pane_current_path}" -w 90% -h 90% -E "workmux dashboard"
bind W popup -d "#{pane_current_path}" -w 80% -h 80% -E "workmux add -A --prompt-editor"
bind t popup -d "#{pane_current_path}" -w 80% -h 80% -E
bind f popup -E -w 80% -h 80% "tmux-sessionizer"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind s choose-tree -Zs
bind Tab switch-client -l
bind a last-window

# Window numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy mode with vi keys and system clipboard
set -s copy-command "wl-copy"
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Alt+hjkl pane switching
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Tmux Thumbs
set -g @thumbs-key Space
set -g @thumbs-alphabet qwerty-homerow
set -g @thumbs-unique enabled
set -g @thumbs-reverse enabled
set -g @thumbs-command 'tmux set-buffer -- {} && echo -n {} | wl-copy && tmux display-message "Copied {}"'
set -g @thumbs-upcase-command 'tmux set-buffer -- {} && echo -n {} | wl-copy && tmux paste-buffer && tmux display-message'

# Load plugins and theme
source-file ~/.config/tmux/plugins.conf
source-file ~/.config/tmux/colors-generated.conf
source-file ~/.config/tmux/theme.conf
